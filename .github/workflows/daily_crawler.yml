name: Daily Stock Crawler

on:
  schedule:
    # 台灣時間每週一至週五 15:35 (UTC 07:35)
    - cron: '35 7 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行

jobs:
  update-stock-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scheduler pipeline
        run: python scheduler.py

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stock.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update stock data [skip ci]" && git push)
